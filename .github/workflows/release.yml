name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - 'releases/v*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          notes="releases/${tag}.md"
          test -f "$notes" || { echo "Missing $notes" >&2; exit 1; }
          title="$(sed -n '1s/^# //p' "$notes")"
          test -n "$title" || { echo "Missing release title in $notes" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          NOTES: ${{ steps.release.outputs.notes }}
          TITLE: ${{ steps.release.outputs.title }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to release."
            exit 0
          fi
          npm pack
          artifact="mk3008-serene-${VERSION}.tgz"
          test -f "$artifact"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "$NOTES" \
            "$artifact#npm package"
