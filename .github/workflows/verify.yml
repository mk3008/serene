name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: serene
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d serene"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:packed
      - name: Install regression-only PostgreSQL driver
        run: npm install --no-save --package-lock=false --ignore-scripts pg@8.16.3
      - run: npm run test:postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/serene
